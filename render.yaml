# Render Blueprint — one-click backend deploy.
# Render Dashboard → New + → Blueprint → connect this repo → Apply.
# Spec: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: dhansaarthi-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      # Set this to your Vercel URL after the frontend deploys (Render will prompt).
      - key: ALLOWED_ORIGINS
        sync: false
